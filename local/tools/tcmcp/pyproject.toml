[project]
name = "tcmcp"
version = "0.1.0"
description = "Tencent Cloud MCP Initializr — generate a scoped ops MCP project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "tencentcloud-sdk-python>=3.0.1400",
    "cos-python-sdk-v5>=1.9.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "mcp>=1.12.0,<2",
    "tomlkit>=0.13,<1",
    "json5>=0.10,<1",
]

[project.scripts]
tcmcp = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[package]
name = "loopforge-desktop"
version = "1.0.0"
description = "LoopForge Windows Desktop App - Native Tauri application for AI Agent Orchestration Platform"
authors = ["LoopForge Team"]
license = "MIT"
repository = "https://github.com/Tencent/LoopForge"
edition = "2021"

[build-dependencies]
 tauri-build = { version = "2.0", features = [] }

[dependencies]
 tauri = { version = "2.0", features = ["tray-icon", "protocol-asset", "windows-7-compat", "api-all"] }
 tauri-plugin-positioner = "2.0"
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0"
 tokio = { version = "1.0", features = ["full"] }
 once_cell = "1.18"
 lazy_static = "1.4"
 anyhow = "1.0"
 log = "0.4"
dirs = "5.0"

[features]
# This feature is used for production builds or when a dev server is not specified
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[package.metadata.deb]
section = "devel"
priority = "optional"

name: Build Desktop Installer

on:
  push:
    branches: [ main, feature/tauri-desktop-app ]
    paths:
      - 'desktop-tauri/**'
      - 'web/app/runs.js'
      - 'internal/httpapi/gin_helpers.go'
  pull_request:
    branches: [ main ]
    paths:
      - 'desktop-tauri/**'

jobs:
  build-tauri:
    name: Build Tauri Desktop App
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true

      - name: Install dependencies
        run: |
          cd desktop-tauri
          npm install

      - name: Build Go backend
        run: |
          cd cmd/agentflow
          go build -trimpath -ldflags "-s -w" -o ../../desktop-tauri/src-tauri/loopforge-backend.exe .

      - name: Build Tauri app
        run: |
          cd desktop-tauri
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers
          path: |
            desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  build-tauri-macos:
    name: Build Tauri Desktop App (macOS)
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          target: x86_64-apple-darwin

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true

      - name: Install dependencies
        run: |
          cd desktop-tauri
          npm install

      - name: Build Go backend
        run: |
          cd cmd/agentflow
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../desktop-tauri/src-tauri/loopforge-backend .

      - name: Build Tauri app
        run: |
          cd desktop-tauri
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-macos
          path: |
            desktop-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            desktop-tauri/src-tauri/target/release/bundle/app/*.app
          retention-days: 7

  build-tauri-linux:
    name: Build Tauri Desktop App (Linux)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          target: x86_64-unknown-linux-gnu

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: true

      - name: Install dependencies
        run: |
          cd desktop-tauri
          npm install

      - name: Build Go backend
        run: |
          cd cmd/agentflow
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../desktop-tauri/src-tauri/loopforge-backend .

      - name: Build Tauri app
        run: |
          cd desktop-tauri
          npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installers-linux
          path: |
            desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop-tauri/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7

  <!-- Tauri compatibility layer MUST load first -->
  <script>
    // Set backend URL immediately
    window.__TAURI_BACKEND_URL__ = 'http://127.0.0.1:8090';
    window.__TAURI_ENV__ = true;
    
    // Prevent Tauri-specific issues
    if (typeof window.__TAURI__ !== 'undefined') {
      // Tauri-specific initialization
      window.__TAURI_READY__ = true;
    }
  </script>
  
  <!-- Load compatibility layer -->
  <script src="tauri-compat.js"></script>
  
  <!-- Load Tauri interface -->
  <script type="module">
    import { invoke } from '@tauri-apps/api';
    
    // Initialize backend URL
    async function init() {
      try {
        const backendUrl = await invoke('get_backend_url_cmd').catch(() => 'http://127.0.0.1:8090');
        window.__TAURI_BACKEND_URL__ = backendUrl;
        
        // Ensure backend is running
        const isRunning = await invoke('get_backend_status').catch(() => false);
        if (!isRunning) {
          await invoke('start_backend');
        }
      } catch (e) {
        console.warn('Backend initialization error:', e);
      }
    }
    
    init();
  </script>

  <!-- Original loading spinner -->
  <div id="bootLoader" class="boot-loader" role="status" aria-live="polite" aria-busy="true">

    </div>
  </div>

    <!-- Content will be loaded from web/index.html -->
  </div>
  
  <!-- Load the actual web app content -->
  <script>
    // Once compatibility layer is ready, load the app
    function loadWebApp() {
      // Create a script to load the web app
      const script = document.createElement('script');
      script.src = '/app/app.js';
      script.onload = function() {
        // Remove the Tauri-specific loading spinner
        const tauriSplash = document.getElementById('tauriSplash');
        if (tauriSplash) {
          tauriSplash.style.display = 'none';
        }
      };
      script.onerror = function() {
        console.error('Failed to load web app');
      };
      document.body.appendChild(script);
    }
    
    // Check if compatibility layer is loaded
    const checkCompat = setInterval(() => {
      if (window.__TAURI_COMPAT_LOADED__) {
        clearInterval(checkCompat);
        loadWebApp();
      }
    }, 100);
    
    // Fallback timeout
    setTimeout(() => {
      clearInterval(checkCompat);
      loadWebApp();
    }, 5000);
  </script>
  
  <!-- Inject the web app HTML content -->
  <script>
    // In development, we need to fetch the web app HTML
    // In production, we can inline it or serve it from the backend
    async function injectWebAppHTML() {
      try {
        // Try to get the web app HTML from the backend
        const backendUrl = window.__TAURI_BACKEND_URL__ || 'http://127.0.0.1:8090';
        const response = await fetch(backendUrl, { timeout: 10000 });
        if (response.ok) {
          const html = await response.text();
          // Parse and inject only the body content
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const bodyContent = doc.body.innerHTML;
          const appShell = document.querySelector('.app-shell');
          if (appShell) {
            appShell.innerHTML = bodyContent;
          }
        }
      } catch (e) {
        console.warn('Could not fetch web app HTML, using fallback:', e);
        // In production, the backend serves the full app
        // In dev, we might need to proxy
      }
    }
    
    // Delay slightly to let compatibility layer initialize
    setTimeout(injectWebAppHTML, 1000);
  </script>

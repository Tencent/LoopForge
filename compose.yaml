name: loopforge
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: loopforge
      MYSQL_USER: loopforge
      MYSQL_PASSWORD: ${LOOPFORGE_DB_PASSWORD:?Run scripts/configure.sh first}
      MYSQL_ROOT_PASSWORD: ${LOOPFORGE_DB_ROOT_PASSWORD:?Run scripts/configure.sh first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--ngram_token_size=2"]
    ports:
      - "127.0.0.1:${LOOPFORGE_MYSQL_PORT:-33315}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u loopforge --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  artifact-migration:
    profiles: [platform]
    # Upgrade existing volumes before the platform starts. Fresh schemas are created by the platform.
    image: mysql:8.4
    entrypoint: ["sh", "-ec"]
    command:
      - exec mysql -h mysql -u loopforge loopforge < /migrations/042_run_artifacts_content_mediumtext.sql
    environment:
      MYSQL_PWD: ${LOOPFORGE_DB_PASSWORD:?Run scripts/configure.sh first}
    volumes:
      - type: bind
        source: ./migrations/042_run_artifacts_content_mediumtext.sql
        target: /migrations/042_run_artifacts_content_mediumtext.sql
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
  platform:
    profiles: [platform]
    # Published release stack: never builds. Bump the pinned tag (here and in
    # AGENTFLOW_ISOLATED_IMAGE) with each release; source builds use compose.dev.yaml.
    image: ${LOOPFORGE_IMAGE:-ghcr.io/tencent/loopforge:0.4.2}
    ports:
      - "${LOOPFORGE_BIND:-0.0.0.0}:${AGENTFLOW_HTTP_PORT:-8090}:8080"
    environment:
      AGENTFLOW_HTTP_PORT: 8080
      AGENTFLOW_MYSQL_DSN: loopforge:${LOOPFORGE_DB_PASSWORD}@tcp(mysql:3306)/loopforge
      # Optional separate MySQL database for document bodies/index chunks.
      # Empty keeps the content plane on the control connection above.
      AGENTFLOW_KNOWLEDGE_MYSQL_DSN: ${AGENTFLOW_KNOWLEDGE_MYSQL_DSN:-}
      AGENTFLOW_SESSION_SECRET: ${AGENTFLOW_SESSION_SECRET:?Run scripts/configure.sh first}
      AGENTFLOW_PROJECT_CREDENTIAL_KEY: ${AGENTFLOW_PROJECT_CREDENTIAL_KEY:-}
      AGENTFLOW_AUTH_REQUIRED: "true"
      AGENTFLOW_ALLOW_SIGNUP: ${AGENTFLOW_ALLOW_SIGNUP:-true}
      AGENTFLOW_SECURE_COOKIES: ${AGENTFLOW_SECURE_COOKIES:-false}
      AGENTFLOW_GITHUB_CLIENT_ID: ${AGENTFLOW_GITHUB_CLIENT_ID:-}
      AGENTFLOW_GONGFENG_HOST: ${AGENTFLOW_GONGFENG_HOST:-}
      AGENTFLOW_TAPD_HOST: ${AGENTFLOW_TAPD_HOST:-}
      AGENTFLOW_MCP_TOKEN: ${AGENTFLOW_MCP_TOKEN:-}
      AGENTFLOW_GIT_SSH_KNOWN_HOSTS: ${AGENTFLOW_GIT_SSH_KNOWN_HOSTS:-}
      # Chat Bots: keys sealing Bot secrets (scripts/configure.sh adds one),
      # the address users open from chat links, the maintenance switch and
      # the retention of chat text and records in days (0 keeps forever).
      AGENTFLOW_CREDENTIAL_KEYS: ${AGENTFLOW_CREDENTIAL_KEYS:-}
      AGENTFLOW_PUBLIC_URL: ${AGENTFLOW_PUBLIC_URL:-${LOOPFORGE_PUBLIC_URL:-}}
      AGENTFLOW_BOT_WORKERS_ENABLED: ${AGENTFLOW_BOT_WORKERS_ENABLED:-true}
      AGENTFLOW_BOT_BODY_RETENTION_DAYS: ${AGENTFLOW_BOT_BODY_RETENTION_DAYS:-90}
      AGENTFLOW_BOT_RECORD_RETENTION_DAYS: ${AGENTFLOW_BOT_RECORD_RETENTION_DAYS:-180}
      AGENTFLOW_ASSISTANT_SESSION_DIR: /data/assistant
      AGENTFLOW_CONVERSATION_DIR: ${LOOPFORGE_DATA_DIR}/conversations
      AGENTFLOW_CLARIFY_SESSION_DIR: /data/clarify
      AGENTFLOW_BASELINE_ALIGN_EXECUTOR: ${AGENTFLOW_BASELINE_ALIGN_EXECUTOR:-}
      AGENTFLOW_SKIP_CODEBUDDY_INSTALL: ${AGENTFLOW_SKIP_CODEBUDDY_INSTALL:-}
      AGENTFLOW_ASSISTANT_MODEL: ${AGENTFLOW_ASSISTANT_MODEL:-}
      AGENTFLOW_ASSISTANT_MODELS: ${AGENTFLOW_ASSISTANT_MODELS:-}
      AGENTFLOW_APPROVAL_EGRESS_ALLOW_CIDRS: ${AGENTFLOW_APPROVAL_EGRESS_ALLOW_CIDRS:-}
      AGENTFLOW_EVOLUTION_AUTO_ENABLED: ${AGENTFLOW_EVOLUTION_AUTO_ENABLED:-false}
      AGENTFLOW_PREVIEW_PUBLIC_URL: ${AGENTFLOW_PREVIEW_PUBLIC_URL:-}
      AGENTFLOW_PLATFORM_MCP_URL: ${AGENTFLOW_PLATFORM_MCP_URL:-http://platform:8080}
      AGENTFLOW_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-loopforge}_default
      AGENTFLOW_ALLOW_PRIVILEGED_SANDBOX: ${AGENTFLOW_ALLOW_PRIVILEGED_SANDBOX:-false}
      AGENTFLOW_DOCKER_SANDBOX_CPU_MILLICORES: ${AGENTFLOW_DOCKER_SANDBOX_CPU_MILLICORES:-}
      AGENTFLOW_DOCKER_SANDBOX_MEMORY_MIB: ${AGENTFLOW_DOCKER_SANDBOX_MEMORY_MIB:-}
      AGENTFLOW_DOCKER_SANDBOX_PIDS: ${AGENTFLOW_DOCKER_SANDBOX_PIDS:-}
      AGENTFLOW_ISOLATED_IMAGE: ${LOOPFORGE_IMAGE:-ghcr.io/tencent/loopforge:0.4.2}
      HOME: ${LOOPFORGE_DATA_DIR:?Run scripts/configure.sh first}/home
      AGENTFLOW_RUNNER_BINARY: /app/bin/agentflow-runner-{os}-{arch}
      AGENTFLOW_GATE_MCP_BINARY: /app/bin/agentflow-gate-mcp-{os}-{arch}
      # Claude Code is not bundled; it is installed from npm here on first use.
      AGENTFLOW_RUNTIME_CLI_DIR: ${LOOPFORGE_DATA_DIR}/cli
      # 可选向量检索：默认全部留空，平台保持纯关键词检索（只有 MySQL 即可）。
      # 启用 vector profile 时由部署显式设置这些值（见 docs 与启用命令）。
      AGENTFLOW_KB_QDRANT_URL: ${AGENTFLOW_KB_QDRANT_URL:-}
      AGENTFLOW_KB_QDRANT_API_KEY: ${AGENTFLOW_KB_QDRANT_API_KEY:-}
      AGENTFLOW_KB_QDRANT_COLLECTION: ${AGENTFLOW_KB_QDRANT_COLLECTION:-}
      AGENTFLOW_KB_EMBEDDING_PROVIDER: ${AGENTFLOW_KB_EMBEDDING_PROVIDER:-}
      AGENTFLOW_KB_EMBEDDING_URL: ${AGENTFLOW_KB_EMBEDDING_URL:-}
      AGENTFLOW_KB_EMBEDDING_API_KEY: ${AGENTFLOW_KB_EMBEDDING_API_KEY:-}
      AGENTFLOW_KB_EMBEDDING_MODEL: ${AGENTFLOW_KB_EMBEDDING_MODEL:-}
      AGENTFLOW_KB_EMBEDDING_DIM: ${AGENTFLOW_KB_EMBEDDING_DIM:-}
      AGENTFLOW_KB_EMBEDDING_MAX_LENGTH: ${AGENTFLOW_KB_EMBEDDING_MAX_LENGTH:-}
    command: ["-workspaces", "${LOOPFORGE_DATA_DIR}/workspaces"]
    volumes:
      - platform-data:/data
      # Docker sandboxes bind workspace paths on the host, so the data
      # directory keeps the same absolute path inside the container.
      - ${LOOPFORGE_DATA_DIR}:${LOOPFORGE_DATA_DIR}
      - ${LOOPFORGE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      artifact-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  # ===== 可选 profile：向量检索 =====
  # docker compose --profile vector up -d --build qdrant embedding
  # 平台对二者是弱依赖：不可用或停掉时自动降级为关键词检索并在结果里标记。
  # 镜像均来自公开来源；embedding 模型固定 Hugging Face 版本与 SHA-256 校验值。
  qdrant:
    profiles: [vector]
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:${LOOPFORGE_QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  embedding:
    profiles: [vector]
    # 本地构建标签由公开 python 基础镜像（Dockerfile 内按 digest 固定）加
    # 锁定 SHA-256 的 Python 依赖和固定 revision/SHA-256 的模型构建；可按需用
    # 已构建好的等价镜像覆盖（LOOPFORGE_EMBEDDING_IMAGE），仓库内不写内部镜像名。
    image: ${LOOPFORGE_EMBEDDING_IMAGE:-loopforge-kb-embedding:bge-m3-onnx-int8}
    build:
      context: ./deploy/embedding-sidecar
    environment:
      EMBEDDING_MODEL: ${LOOPFORGE_EMBEDDING_MODEL:-gpahal/bge-m3-onnx-int8}
      EMBEDDING_REVISION: ${LOOPFORGE_EMBEDDING_REVISION:-2b34e84df040034d4b9eabb62383a87c18955822}
      EMBEDDING_ONNX_SHA256: ${LOOPFORGE_EMBEDDING_ONNX_SHA256:-16de7ea1146ca427e14938ec3e9abfdcaff0e6ac76434cd693ac35d761250bcb}
      EMBEDDING_DIM: ${LOOPFORGE_EMBEDDING_DIM:-1024}
      EMBEDDING_MAX_LENGTH: ${LOOPFORGE_EMBEDDING_MAX_LENGTH:-256}
      EMBEDDING_CACHE_DIR: /models/cache
      HF_HOME: /models/huggingface
      EMBEDDING_HEALTH_HOST: 127.0.0.1
      EMBEDDING_HEALTH_TIMEOUT: "170"
    ports:
      - "127.0.0.1:${LOOPFORGE_EMBEDDING_PORT:-8081}:8081"
    volumes:
      - embedding-models:/models
    healthcheck:
      test: ["CMD", "python", "server.py", "--healthcheck"]
      interval: 15s
      timeout: 180s
      start_period: 10m
      retries: 3
    restart: unless-stopped

volumes:
  mysql-data:
  platform-data:
  qdrant-data:
  embedding-models:

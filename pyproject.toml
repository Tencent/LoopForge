[build-system]
requires = ["setuptools==75.3.4", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow-workflow"
version = "0.1.0"
description = "Multi-agent development workflows for CodeBuddy, Codex, Cursor, and Claude Code"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "LoopForge Contributors"}]
keywords = ["ai-agents", "multi-agent", "coding-agent", "codex", "claude-code"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/Tencent/LoopForge"
Issues = "https://github.com/Tencent/LoopForge/issues"
Changelog = "https://github.com/Tencent/LoopForge/blob/master/CHANGELOG.md"

[project.scripts]
loopforge = "devflow_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

name: republish-legacy-images

# One-off, run from an unmerged pull request: the 0.3.0 and 0.3.1 images
# bundled Claude Code, which LoopForge may not redistribute. Rebuild each
# release from its own tag without that package and push over its version
# and sha- tags. 0.3 and latest already point to 0.3.2, which never bundled it.
on:
  pull_request:
    paths:
      - .github/workflows/republish-legacy-images.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: republish-legacy-images
  cancel-in-progress: false

jobs:
  republish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tag: [v0.3.0, v0.3.1]
    env:
      TAG: ${{ matrix.tag }}
      LOCAL_IMAGE: loopforge-republish:${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ matrix.tag }}

      - name: Remove Claude Code from the Dockerfile
        id: source
        run: |
          sed -i 's# @anthropic-ai/claude-code@[^ ]*##' Dockerfile
          if grep -n 'claude-code' Dockerfile; then
            echo "Dockerfile still installs Claude Code" >&2
            exit 1
          fi
          git diff --stat
          {
            echo "version=${TAG#v}"
            echo "commit=$(git rev-parse HEAD)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.licenses=MIT

      - name: Check the bundled CLIs
        run: |
          docker run --rm --entrypoint sh "$LOCAL_IMAGE" -c '
            if command -v claude; then echo "claude is still in the image" >&2; exit 1; fi
            if [ -e /usr/local/lib/node_modules/@anthropic-ai/claude-code ]; then echo "claude-code package is still in the image" >&2; exit 1; fi
            codex --version
            codebuddy --version'

      - name: Boot the rebuilt image with the release's own installer
        env:
          LOOPFORGE_IMAGE: ${{ env.LOCAL_IMAGE }}
        run: |
          bash scripts/install.sh < /dev/null
          curl -fsS http://127.0.0.1:8090/api/health

      - if: failure()
        run: docker compose logs platform | tail -200

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push over the release tags
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          VERSION: ${{ steps.source.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          for tag in "$VERSION" "sha-$COMMIT"; do
            docker tag "$LOCAL_IMAGE" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          docker pull -q "$IMAGE:$VERSION"
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '! command -v claude'

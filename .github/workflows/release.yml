name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Existing platform release tag to publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Verify release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_ref || github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag ${TAG} is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "Checkout does not match the release tag commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${TAG} is not on main" >&2
            exit 1
          fi
          ci="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow platform.yml --commit "${tag_commit}" \
            --json event,conclusion --jq '[.[] | select(.event == "push")][0].conclusion // ""')"
          if [[ "${ci}" != "success" ]]; then
            echo "The platform workflow has not succeeded on ${tag_commit} (status: ${ci:-not run})" >&2
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$(grep -cF "/loopforge:${version}}" compose.yaml)" != 2 ]]; then
            echo "compose.yaml must pin loopforge:${version} (platform image and AGENTFLOW_ISOLATED_IMAGE) before tagging ${TAG}" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "sha=$(git rev-parse HEAD)"
            echo "image=${image}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      # arm64 lets Apple silicon and arm servers pull the image; only the final
      # stage runs under emulation, the Go and chatbot builds cross-compile.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}
            type=raw,value=latest,enable=${{ steps.release.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image by digest
        env:
          LOOPFORGE_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          ./start.sh -d
          curl -fsS http://127.0.0.1:8090/api/health

      - if: failure()
        run: docker compose logs platform | tail -200

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          notes="$(cat <<EOF
          ## Install

          \`\`\`bash
          git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git
          cd ${GITHUB_REPOSITORY#*/}
          ./start.sh
          \`\`\`

          Platform image: \`${IMAGE}:${VERSION}\` (pinned in \`compose.yaml\`).

          Digest: \`${IMAGE}@${DIGEST}\`.

          Where \`ghcr.io\` is slow, set \`MIRROR\` to a registry host that replaces it (for example \`MIRROR=ghcr.nju.edu.cn ./start.sh\`). This trusts that host: the download is tagged as the pinned name. Check it with \`docker image inspect --format '{{index .RepoDigests 0}}' ${IMAGE}:${VERSION}\` and compare the digest after \`@\`. Existing installations: check out \`${TAG}\`, run \`./start.sh\`, and apply the new files under \`migrations/\` listed in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md).
          EOF
          )"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; image republished"
            exit 0
          fi
          release_args=(--title "LoopForge v${VERSION}" --notes "${notes}" --generate-notes --verify-tag)
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${TAG}" "${release_args[@]}"

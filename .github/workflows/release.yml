name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Existing platform release tag to publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Verify release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_ref || github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag ${TAG} is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "Checkout does not match the release tag commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${TAG} is not on main" >&2
            exit 1
          fi
          ci="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow platform.yml --commit "${tag_commit}" \
            --json event,conclusion --jq '[.[] | select(.event == "push")][0].conclusion // ""')"
          if [[ "${ci}" != "success" ]]; then
            echo "The platform workflow has not succeeded on ${tag_commit} (status: ${ci:-not run})" >&2
            exit 1
          fi
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "image=${image}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ steps.release.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          notes="$(cat <<EOF
          ## Install

          \`\`\`bash
          git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git
          cd ${GITHUB_REPOSITORY#*/}
          LOOPFORGE_IMAGE=${IMAGE}:${VERSION} LOOPFORGE_PUBLIC_URL=https://loopforge.example.com bash scripts/install.sh
          \`\`\`

          Platform image: \`${IMAGE}:${VERSION}\`. Existing installations: update \`LOOPFORGE_IMAGE\` in \`.env\`, re-run \`bash scripts/install.sh\`, and apply the new files under \`migrations/\` listed in [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md).
          EOF
          )"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; image republished"
            exit 0
          fi
          release_args=(--title "LoopForge v${VERSION}" --notes "${notes}" --generate-notes --verify-tag)
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${TAG}" "${release_args[@]}"

name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Existing platform release tag to publish (for example v0.3.0)"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Verify release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.source_ref || github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag ${TAG} is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "Checkout does not match the release tag commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${TAG} is not on main" >&2
            exit 1
          fi
          ci="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow platform.yml --commit "${tag_commit}" \
            --json event,conclusion --jq '[.[] | select(.event == "push")][0].conclusion // ""')"
          if [[ "${ci}" != "success" ]]; then
            echo "The platform workflow has not succeeded on ${tag_commit} (status: ${ci:-not run})" >&2
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$(grep -cF "/loopforge:${version}}" compose.yaml)" != 2 ]]; then
            echo "compose.yaml must pin loopforge:${version} (platform image and AGENTFLOW_ISOLATED_IMAGE) before tagging ${TAG}" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          prerelease=false
          [[ "${version}" == *-* ]] && prerelease=true
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "sha=$(git rev-parse HEAD)"
            echo "image=${image}"
            echo "prerelease=${prerelease}"
            echo "commit=${tag_commit}"
          } >> "$GITHUB_OUTPUT"

      - name: Select the preceding published stable platform release
        id: upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --exclude-drafts --exclude-pre-releases \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/platform-releases.json"
          from_tag=$(python3 scripts/release-upgrade-base.py "$TAG" < "$RUNNER_TEMP/platform-releases.json")
          if [[ -n "$from_tag" ]]; then
            git rev-parse --verify "refs/tags/${from_tag}^{commit}"
            echo "Upgrade validation: $from_tag -> $TAG"
          fi
          echo "from_tag=$from_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      # arm64 lets Apple silicon and arm servers pull the image; only the final
      # stage runs under emulation, the Go and chatbot builds cross-compile.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}
            type=raw,value=latest,enable=${{ steps.release.outputs.prerelease == 'false' }}

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            LOOPFORGE_COMMIT=${{ steps.release.outputs.commit }}
          # Make the version available for the real installer. Promote the
          # mutable X.Y/latest tags only after clean-install AND upgrade tests.
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image by digest
        env:
          LOOPFORGE_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          bash scripts/install.sh
          curl -fsS http://127.0.0.1:8090/api/health

      - name: Verify an existing installation upgrades without losing user data
        if: steps.upgrade.outputs.from_tag != ''
        timeout-minutes: 15
        env:
          FROM_TAG: ${{ steps.upgrade.outputs.from_tag }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          bash scripts/test-upgrade.sh "$FROM_TAG" "$TAG" "$RELEASE_IMAGE"
          echo "Verified upgrade: $FROM_TAG → $TAG, preserving user data and repeated installation." >> "$GITHUB_STEP_SUMMARY"

      - if: failure()
        run: docker compose logs platform | tail -200

      - name: Promote the verified image tags
        env:
          METADATA: ${{ steps.metadata.outputs.json }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          tags=$(jq -er '.tags[]' <<< "$METADATA")
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$tags"
          docker buildx imagetools create "${args[@]}" "$RELEASE_IMAGE"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          ## Install

          \`\`\`bash
          git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git
          cd ${GITHUB_REPOSITORY#*/}
          ./start.sh
          \`\`\`

          Platform image: \`${IMAGE}:${VERSION}\` (pinned in \`compose.yaml\`).

          Digest: \`${IMAGE}@${DIGEST}\`.

          Where \`ghcr.io\` is slow, set \`MIRROR\` to a registry host that replaces it (for example \`MIRROR=ghcr.nju.edu.cn ./start.sh\`). This trusts that host: the download is tagged as the pinned name. Check it with \`docker image inspect --format '{{index .RepoDigests 0}}' ${IMAGE}:${VERSION}\` and compare the digest after \`@\`.

          ## Upgrade an existing installation

          Back up the database, \`.env\` and \`LOOPFORGE_DATA_DIR\` first. Review [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for every intervening release and apply its required SQL migrations in the documented order.

          In the original installation directory:

          \`\`\`bash
          git fetch origin --tags
          git checkout ${TAG}
          bash scripts/install.sh
          \`\`\`

          Keep the original \`.env\`, data directory and Compose project name. If \`.env\` pins \`LOOPFORGE_IMAGE\`, update it to \`${IMAGE}:${VERSION}\` or clear it to use the checkout's default. \`./start.sh pull\` only refreshes the configured image; it does not select a newer release. See the [upgrade guide](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/deployment.md#upgrading-an-existing-installation).
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; image republished"
            exit 0
          fi
          release_args=(--title "LoopForge v${VERSION}" --notes-file "$notes_file" --generate-notes --verify-tag)
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${TAG}" "${release_args[@]}"

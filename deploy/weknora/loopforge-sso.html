<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>正在进入 WeKnora 控制台…</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f6f8;
    color: #1f2329;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e8eaed; }
    .card { background: #1f2227; border-color: #2c3036; }
    .muted { color: #9aa0a6; }
    .btn { background: #4f7cff; color: #fff; }
  }
  .card {
    width: min(420px, calc(100vw - 48px));
    padding: 28px 30px;
    border: 1px solid #e3e6eb;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .06);
  }
  h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  p { margin: 0 0 14px; }
  .muted { color: #6b7280; word-break: break-all; }
  .btn {
    display: inline-block;
    padding: 7px 14px;
    border-radius: 8px;
    background: #1f6feb;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
  }
  .spinner {
    width: 14px; height: 14px; margin-right: 8px;
    border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; display: inline-block; vertical-align: -2px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <main class="card">
    <h1 id="title"><span class="spinner" aria-hidden="true"></span>正在进入 WeKnora 控制台…</h1>
    <p class="muted" id="detail">正在向 LoopForge 校验一次性登录票据。</p>
    <a class="btn" id="fallback" href="/" hidden>前往 WeKnora 登录页</a>
  </main>
<script>
(function () {
  'use strict';

  var BUILTIN_QUICK_ANSWER_ID = 'builtin-quick-answer';
  var KB_LIST_PATH = '/platform/knowledge-bases';

  var raw = location.hash && location.hash.charAt(0) === '#' ? location.hash.slice(1) : '';
  // 票据只应出现在 fragment 中；页面处理完立刻从地址栏与历史记录里抹掉，
  // 避免被截图、同步或历史记录泄露。
  try { history.replaceState(null, '', location.pathname); } catch (err) {}

  var params = new URLSearchParams(raw);
  var ticket = params.get('ticket') || '';
  var api = params.get('api') || '';
  var next = params.get('next') || KB_LIST_PATH;

  var titleEl = document.getElementById('title');
  var detailEl = document.getElementById('detail');
  var fallbackEl = document.getElementById('fallback');

  function fail(message) {
    titleEl.textContent = '无法自动登录 WeKnora';
    detailEl.textContent = message;
    fallbackEl.hidden = false;
  }

  // api 必须是 http(s) 且与当前控制台同主机：阻止把票据兑换到第三方站点，
  // 也阻止别的站点构造链接把受害者登进攻击者的账号（Login CSRF）。
  function validAPI(value) {
    try {
      var u = new URL(value);
      return (u.protocol === 'http:' || u.protocol === 'https:') &&
        u.hostname === location.hostname && !u.username && !u.password &&
        !u.search && !u.hash;
    } catch (err) {
      return false;
    }
  }

  // next 只允许站内绝对路径，防止开放重定向。
  function validNext(value) {
    return typeof value === 'string' && value.charAt(0) === '/' &&
      value.charAt(1) !== '/' && value.charAt(1) !== '\\' && value.indexOf('\\') === -1;
  }

  function readJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (err) { return null; }
  }

  // 与 WeKnora 的 auth store 保持一致：切换账号/租户后，旧租户下的知识库、
  // Agent、模型选择都会失效，必须清掉，否则新会话会带着旧 id 请求上游。
  function clearTenantScopedClientState() {
    try {
      localStorage.removeItem('weknora_current_kb');
      localStorage.removeItem('weknora_knowledge_bases');
      localStorage.removeItem('weknora_lite_mode');
      localStorage.removeItem('weknora_last_chat_model_id');
      Object.keys(localStorage).forEach(function (key) {
        if (key.indexOf('last_chat_model') !== -1) localStorage.removeItem(key);
      });
      var rawSettings = localStorage.getItem('WeKnora_settings');
      if (!rawSettings) return;
      var parsed = JSON.parse(rawSettings);
      if (!parsed || typeof parsed !== 'object') return;
      parsed.selectedAgentId = BUILTIN_QUICK_ANSWER_ID;
      parsed.selectedAgentSourceTenantId = null;
      parsed.isAgentEnabled = false;
      if (parsed.conversationModels && typeof parsed.conversationModels === 'object') {
        parsed.conversationModels.summaryModelId = '';
        parsed.conversationModels.rerankModelId = '';
        parsed.conversationModels.selectedChatModelId = '';
      }
      parsed.selectedKnowledgeBases = [];
      parsed.selectedFiles = [];
      parsed.selectedFileKbMap = {};
      parsed.knowledgeBaseId = '';
      localStorage.setItem('WeKnora_settings', JSON.stringify(parsed));
    } catch (err) {
      // localStorage 可能被禁用或存了坏 JSON，尽力而为。
    }
  }

  function persist(payload) {
    if (!payload || !payload.token || !payload.user) {
      throw new Error('登录响应缺少 token 或用户信息');
    }
    var prevUser = readJSON('weknora_user');
    var prevSelectedRaw = localStorage.getItem('weknora_selected_tenant_id');
    var prevSelectedId = prevSelectedRaw === null ? null : Number(prevSelectedRaw);

    var activeTenant = payload.active_tenant || payload.tenant || null;
    var homeTenantIdRaw = payload.user.tenant_id != null
      ? payload.user.tenant_id
      : (activeTenant && activeTenant.id != null ? activeTenant.id : '');

    var user = Object.assign({}, payload.user);
    user.tenant_id = homeTenantIdRaw;
    delete user.password;

    localStorage.setItem('weknora_user', JSON.stringify(user));
    localStorage.setItem('weknora_token', payload.token);
    if (payload.refresh_token) localStorage.setItem('weknora_refresh_token', payload.refresh_token);
    else localStorage.removeItem('weknora_refresh_token');

    if (activeTenant) {
      localStorage.setItem('weknora_tenant', JSON.stringify({
        id: String(activeTenant.id || ''),
        name: activeTenant.name || '',
        owner_id: payload.user.id || '',
        created_at: activeTenant.created_at || new Date().toISOString(),
        updated_at: activeTenant.updated_at || new Date().toISOString()
      }));
    } else {
      localStorage.removeItem('weknora_tenant');
    }

    if (Array.isArray(payload.memberships)) {
      localStorage.setItem('weknora_memberships', JSON.stringify(payload.memberships));
    } else {
      // 新账号的响应没有 memberships 时必须清空，否则会残留上一个账号的租户列表。
      localStorage.removeItem('weknora_memberships');
    }

    // 后端可能按用户上次活跃租户把人放进非 home 租户，这时要写 override；
    // 否则必须清掉上一个账号留下的 override。
    var activeIdNum = Number(activeTenant && activeTenant.id);
    var homeIdNum = Number(homeTenantIdRaw);
    var selectedId = (isFinite(activeIdNum) && isFinite(homeIdNum) && activeIdNum !== homeIdNum)
      ? activeIdNum
      : null;
    if (selectedId !== null) {
      localStorage.setItem('weknora_selected_tenant_id', String(selectedId));
      if (activeTenant && activeTenant.name) {
        localStorage.setItem('weknora_selected_tenant_name', activeTenant.name);
      } else {
        localStorage.removeItem('weknora_selected_tenant_name');
      }
    } else {
      localStorage.removeItem('weknora_selected_tenant_id');
      localStorage.removeItem('weknora_selected_tenant_name');
    }

    var accountChanged = !!prevUser && String(prevUser.id == null ? '' : prevUser.id) !== String(user.id == null ? '' : user.id);
    if (accountChanged || prevSelectedId !== selectedId) clearTenantScopedClientState();
  }

  if (!ticket) {
    fail('链接缺少登录票据，请回到 LoopForge 知识中心重新打开控制台。');
    return;
  }
  if (!validAPI(api)) {
    fail('登录请求来源校验失败：LoopForge 与 WeKnora 控制台需要使用同一个主机名访问。');
    return;
  }
  if (!validNext(next)) next = KB_LIST_PATH;

  fetch(api.replace(/\/+$/, '') + '/api/knowledge/weknora/console-sso/redeem', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ticket: ticket })
  }).then(function (res) {
    return res.json().catch(function () { return {}; }).then(function (body) {
      if (!res.ok) throw new Error(body && body.error ? body.error : ('HTTP ' + res.status));
      return body;
    });
  }).then(function (payload) {
    persist(payload);
    titleEl.textContent = '正在打开 WeKnora…';
    location.replace(next);
  }).catch(function (err) {
    fail(err && err.message ? err.message : '登录票据校验失败，请回到 LoopForge 重新打开控制台。');
  });
})();
</script>
</body>
</html>

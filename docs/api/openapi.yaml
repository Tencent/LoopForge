          description: Workspace restoration accepted (Prefer respond-async); poll restore status before repeating the decision
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

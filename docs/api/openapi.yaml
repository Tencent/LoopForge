  /api/issues/{issueId}/clarify:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: assessIssueClarification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Clarification assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClarificationAssessment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/issues/{issueId}/chat-clarify:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    get:
      tags: [Issues]
      operationId: attachIssueClarify
      description: Attach to an in-flight server-side clarification job and replay thought events over SSE.
      responses:
        "200":
          description: Server-Sent Events stream
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Issues]
      operationId: chatClarifyIssue
      description: Starts a server-side clarification job that keeps running after the client disconnects. Returns JSON normally, or an SSE stream when Accept is text/event-stream.
      requestBody:
        $ref: "#/components/requestBodies/ChatClarify"
      responses:
        "200":
          $ref: "#/components/responses/ClarifyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
  /api/issues/{issueId}/chat-clarify/cancel:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: cancelIssueClarify
      description: Cancel one issue's in-flight server-side clarification job.
      responses:
        "200":
          description: Cancellation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled:

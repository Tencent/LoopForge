        enabled:
          type: boolean
        projectId:
          type: string
        source:
          type: string
          enum: [gongfeng, tapd]
          description: Compatibility field; jobs no longer pull TAPD/Gongfeng themselves.
        tapdWorkspaceId:
          type: string
        tapdIterationId:
          type: string
        workflowId:
          type: string
          description: Required for trigger jobs. Ignored when skipDispatch is true.
        useIssueWorkflow:
          type: boolean
          description: When true, prefer the issue's bound SOP and fall back to workflowId.
        skipDispatch:
          type: boolean
          description: "When true, this is an AI scheduled job: run assistantPrompt only. When false, this is a trigger job that scans issues and dispatches SOP. The two kinds are exclusive."
        intervalSec:
          type: integer
          minimum: 0
          description: Used when cron is empty. Common values are 300, 900, 3600, 86400.
        cron:
          type: string
          description: Optional 5-field cron (minute hour day month weekday) in Asia/Shanghai. When set, intervalSec is ignored.
        assistantPrompt:
          type: string
          description: User-written CodeBuddy prompt executed at schedule time. Required for independent AI jobs; subscriptions resolve their pinned shared version instead. Cleared on trigger jobs.
        assistantModel:
          type: string
          description: CodeBuddy model id from GET /api/assistant/models.
        ownerUserId:
          type: integer
          format: int64
          description: Project owner whose CodeBuddy key runs assistantPrompt
        lastRunAt:
          type: string
          format: date-time
          readOnly: true
        lastStatus:
          type: string
          enum: [running, success, failed, waiting]
          description: running means this instance is still executing the job (closing Studio does not cancel it).
          readOnly: true
        lastError:
          type: string
          readOnly: true
        lastPulled:
          type: integer
          description: Candidate issues scanned in the project
          readOnly: true
        lastDispatched:
          type: integer
          readOnly: true
        lastAssistantMessage:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    WorkflowMetrics:
      type: object
      additionalProperties: true
      properties:
        workflowId:
          type: string
        totalRuns:
          type: integer
        activeRuns:
          type: integer
        waitingRuns:
          type: integer
        succeededRuns:
          type: integer
        failedRuns:
          type: integer
        closureRate:
          type: number
        successRate:
          type: number
        averageDurationMs:
          type: integer
          format: int64
        totalTokens:
          type: integer
          format: int64
    AnalyticsCostSummary:
      type: object
      additionalProperties: true
      description: 'Operational summary. Costs are public standard token estimates except HY reported charges; raw billing facts are unchanged. All analytics breakdowns, trends, traces and delivery rows additionally expose costCny; legacy costUsd fields are USD equivalents of the CNY statistic.'
      properties:
        costCurrency: {type: string, const: CNY}
        usdToCny: {type: number, const: 7}
        costPricingVersion: {type: string}
        totalCostCny: {type: number}
        costReportedCny: {type: number, description: 'Recognized amount, including recognized parts of incompletely priced runs'}
        costCoveragePct: {type: number}
        costUnknownRuns: {type: integer}
    AnalyticsDeliveryMR:
      type: object
      additionalProperties: true
      properties:
        project: {type: string}
        iid: {type: integer}
        url: {type: string}
        state: {type: string, description: 'State of this individual MR, including merged or integrated'}
        targetBranch: {type: string}
    AnalyticsDelivery:
      type: object
      additionalProperties: true
      properties:
        mrs:
          type: array
          description: 'All associated MRs; singular mrUrl, mrIid and mrState remain primary-link compatibility fields'
          items:
            $ref: "#/components/schemas/AnalyticsDeliveryMR"
    AnalyticsDeliverySummary:
      type: object
      additionalProperties: true
      properties:
        issues: {type: integer}
        withMr: {type: integer, description: 'Requirements with an MR, used by the requirement funnel'}
        totalMrs: {type: integer, description: 'Unique repository and MR IID pairs'}
        mrMerged: {type: integer, description: 'Individual MRs landed on mainline'}
        mrIntegrated: {type: integer, description: 'Individual MRs landed on an integration branch'}
        issuesWithMergedMr: {type: integer, description: 'Requirements with a mainline MR, used by the requirement funnel'}
    AnalyticsSnapshot:
      type: object
      additionalProperties: true
      required: [filter, summary, trend, workflows, agents, executors, models, nodes, failures, coverage, delivery, demo]
      properties:
        filter:
          $ref: "#/components/schemas/OpenObject"
        summary:
          $ref: "#/components/schemas/AnalyticsCostSummary"
        trend:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        workflows:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        executors:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        models:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        coverage:
          $ref: "#/components/schemas/OpenObject"
        deliveries:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDelivery"
        delivery:
          $ref: "#/components/schemas/AnalyticsDeliverySummary"
        demo:
          $ref: "#/components/schemas/OpenObject"
        runTraces:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
    Bootstrap:
      type: object
      additionalProperties: true
      required:
        - projects
        - repositories
        - users
        - agents
        - rules

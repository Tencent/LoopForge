        - mcpServers
        - executors
        - dockerfiles
        - environments
        - sandboxes
        - workflows
        - syncConfig
        - scheduleJobs
        - schedulerEnabled
        - storage
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        repositories:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentDefinition"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        mcpServers:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        executors:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"
        dockerfiles:
          type: array
          items:

  /api/skillhub/install:
    post:
      tags: [Assets]
      operationId: installSkillhubSkill
      summary: Download a SkillHub package and store it as a project skill
      description: Files and the skill row are written in one transaction; any failure leaves no partial skill. The new skill records source {provider, namespace, slug, version, homepage, installedAt, updatedAt} and its files are read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, projectId]
              properties:
                slug: {type: string}
                namespace: {type: string}
                version: {type: string, description: Defaults to the latest version}
                projectId: {type: string}
                id: {type: string, description: Defaults to slug}
                name: {type: string}
      responses:
        "201":
          description: Installed SkillDefinition
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/SkillhubUnavailable"
        "502":
          $ref: "#/components/responses/SkillhubUnavailable"

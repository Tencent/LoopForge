  /api/issues/{issueId}/clarification:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: saveIssueClarification
      description: Persists one work item's multi-turn clarification. When ready, appends the summary to its linked Gongfeng Issue or TAPD story as a comment without starting its SOP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                ready:
                  type: boolean
                history:
                  type: array
                  items:
                    $ref: "#/components/schemas/ClarificationMessage"
                questions:
                  type: array
                  items:
                    $ref: "#/components/schemas/ClarificationQuestion"
                dimensions:
                  type: object
                  description: Per-dimension completeness ratings (0-100), folded into score with the project policy weights. For requirements this score gates SOP dispatch.
                  additionalProperties:
                    type: integer
                    minimum: 0
                    maximum: 100
                missing:
                  type: array
                  description: Key information still unconfirmed after clarification.
                  items:
                    type: string
                retry:
                  type: boolean
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Workspace is unavailable because its owner instance or remote Runner cannot currently be reached}
        "410": {description: Workspace is no longer available}

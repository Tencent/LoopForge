      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: cancelRun
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/runs/{runId}/pause:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: pauseRun
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/runs/{runId}/resume:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: resumePausedRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/runs/{runId}/refresh-sop:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: refreshPausedRunSOP
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/runs/{runId}/eval:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      operationId: getRunEval
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Runs]
      operationId: startRunEval
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
      responses:
        "202":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/runs/{runId}/evals:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      operationId: listRunEvals
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/runs/{runId}/eval/stream:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      tags: [Runs]
      operationId: streamRunEval
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/runs/{runId}/eval/apply:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: applyRunEval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evalId:
                  type: string
                recommendationIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/sync/config:
    get:
      tags: [Sync]
      operationId: getSyncConfig
      responses:
        "200":
          $ref: "#/components/responses/SyncConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Sync]
      operationId: createSyncConfig
      requestBody:
        $ref: "#/components/requestBodies/SyncConfig"
      responses:
        "200":
          $ref: "#/components/responses/SyncConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Sync]
      operationId: updateSyncConfig
      requestBody:
        $ref: "#/components/requestBodies/SyncConfig"
      responses:
        "200":
          $ref: "#/components/responses/SyncConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sync/now:
    post:
      tags: [Sync]
      operationId: startSync
      responses:
        "200":
          description: Sync accepted
          content:
            application/json:
              schema:
                type: object
                required: [status, syncing]
                properties:
                  status:
                    type: string
                  syncing:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sync/logs:
    get:
      tags: [Sync]
      operationId: listSyncLogs
      responses:
        "200":
          description: Sync logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sync/status:
    get:
      tags: [Sync]
      operationId: getSyncStatus
      responses:
        "200":
          description: Sync status, config, and recent logs
          content:
            application/json:
              schema:
                type: object
                required: [syncing, config, logs]
                properties:
                  syncing:
                    type: boolean
                  config:
                    $ref: "#/components/schemas/SyncConfig"
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/SyncLog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/sync/create:
    post:
      tags: [Sync, Issues]
      operationId: createExternalIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issueId, target]
              properties:
                issueId:
                  type: string
                target:
                  type: string
                  enum: [gongfeng, tapd]
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/notification-bots:
    get:
      summary: List configured project notification Bots and bound chats
      operationId: listNotificationBots
      parameters:
        - name: projectId
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Public Bot records, without credentials
          content:
            application/json:
              schema: {type: array, items: {type: object}}
        "403":
          description: Project membership required
  /api/notification-bots/{id}/interactions:
    get:
      summary: Inspect Bot connection and recent chat interactions
      operationId: inspectBotInteractions
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Connection status, recent conversations and messages; credentials excluded
        "403":
          description: Bot management permission required
  /api/bot-bindings:
    get:
      summary: List the logged-in user's WeCom identity bindings
      operationId: listBotUserBindings
      responses:
        "200":
          description: Bindings belonging to the interactive browser user
        "401":
          description: Interactive browser login required
  /api/bot-bindings/{id}:
    delete:
      summary: Revoke the logged-in user's WeCom identity binding
      operationId: revokeBotUserBinding
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204":
          description: Revoked; outstanding challenges invalidated
        "401":
          description: Interactive browser login required
        "403":
          description: Same-origin browser request required
        "404":
          description: Binding does not belong to the current user
  /api/bot-bindings/claim:
    post:
      summary: Nominate the logged-in account; original WeCom sender must confirm
      operationId: claimBotUserBinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 64, maxLength: 64}
      responses:
        "200":
          description: Login name, status and browser-only confirmation command
        "400":
          description: Expired, invalid or already claimed challenge
        "401":
          description: Interactive browser login required; Bearer tokens rejected
        "403":
          description: Same-origin browser request required
  /api/bot-bindings/status:
    post:
      summary: Read identity challenge status without logging its token in the URL
      operationId: botUserBindingStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 64, maxLength: 64}
      responses:
        "200":
          description: Current challenge status and login name; no confirmation code
        "400":
          description: Expired, invalid or claimed by another account
        "401":
          description: Interactive browser login required
  /api/notification-preview:
    post:
      summary: Preview a notification using sample context without sending or calling AI
      operationId: previewNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, binding]
              properties:
                projectId: {type: string}
                binding: {$ref: "#/components/schemas/NotificationBinding"}
                sourceType: {type: string, enum: [run, schedule_job, assistant_task]}
      responses:
        "200":
          description: Preview content and its source
        "400":
          description: Invalid template
  /api/schedule-jobs:
    get:
      tags: [Scheduling]
      operationId: listScheduleJobs
      responses:
        "200":
          $ref: "#/components/responses/ScheduleJobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Scheduling]
      operationId: createScheduleJob
      requestBody:
        $ref: "#/components/requestBodies/ScheduleJob"
      responses:
        "200":
          $ref: "#/components/responses/ScheduleJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Scheduling]
      operationId: upsertScheduleJob
      requestBody:
        $ref: "#/components/requestBodies/ScheduleJob"
      responses:
        "200":
          $ref: "#/components/responses/ScheduleJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/schedule-jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    delete:
      tags: [Scheduling]
      operationId: deleteScheduleJob
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/schedule-jobs/{jobId}/run:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Scheduling]
      operationId: runScheduleJob
      description: |
        Starts the job on the server and returns 202 with lastStatus=running.
        Closing the client does not cancel the run. Poll GET /api/schedule-jobs
        until lastStatus is success, failed, or waiting.
      responses:
        "202":
          $ref: "#/components/responses/ScheduleJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: agentflow_user
    basicAuth:
      type: http
      scheme: basic
  parameters:
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    AssetIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    RepositoryIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
    NodeIdQuery:
      name: nodeId
      in: query
      schema:
        type: string
    After:
      name: after
      in: query
      schema:
        type: integer
        format: int64
    Before:
      name: before
      in: query
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
  requestBodies:
    Project:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Project"
              - type: object
                properties:
                  tapdClear:
                    type: boolean
    Repository:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoryInput"
    Issue:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Issue"
              - type: object
                properties:
                  syncTarget:
                    type: string
                    enum: [gongfeng, tapd]
    ChatClarify:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChatClarifyRequest"
    Agent:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentDefinition"
    Asset:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenObject"
    Workflow:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowDefinition"
    NodeAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nodeId]
            properties:
              nodeId:
                type: string
    SyncConfig:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncConfig"
    ScheduleJob:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScheduleJob"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Basic authentication required
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Operation is disabled or forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: Upstream analysis timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Ok:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ok"
    Status:
      description: Status result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    Project:
      description: Project
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Project"
    ProjectList:
      description: Project list
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Project"
    Repository:
      description: Repository
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Repository"
    Issue:
      description: Issue
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Issue"
    Workflow:
      description: Workflow definition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowDefinition"
    WorkflowList:
      description: Workflow definitions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/WorkflowDefinition"
    Run:
      description: Run
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Run"
    RunList:
      description: Run summaries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Run"
    RevisionList:
      description: Definition revisions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DefinitionRevision"
    AssetList:
      description: Asset definitions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpenObject"
    ClarifyResult:
      description: JSON clarification result or SSE event stream
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClarifyResult"
        text/event-stream:
          schema:
            type: string
    SyncConfig:
      description: Sync configuration
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncConfig"
    ScheduleJob:
      description: Schedule job
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScheduleJob"
    ScheduleJobList:
      description: Schedule jobs
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ScheduleJob"
  schemas:
    OpenObject:
      type: object
      additionalProperties: true
    APIToken:
      type: object
      required: [id, userId, name, prefix, createdAt]
      properties:
        id: {type: string}
        userId: {type: integer, format: int64}
        name: {type: string}
        prefix: {type: string, description: Non-secret display prefix}
        lastUsedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    BusinessDomain:
      type: object
      required: [id, name, active, managerIds, viewerIds]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$', description: 'Stable ID; all and unclassified are reserved'}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        active: {type: boolean}
        managerIds: {type: array, uniqueItems: true, items: {type: integer, format: int64}}
        viewerIds: {type: array, uniqueItems: true, items: {type: integer, format: int64}}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    BusinessDomainAssignment:
      type: object
      properties:
        id: {type: integer, format: int64}
        projectId: {type: string}
        fromDomainId: {type: string}
        toDomainId: {type: string}
        actorId: {type: integer, format: int64}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
    BusinessDomainReport:
      type: object
      properties:
        attribution: {type: string, const: current}
        generatedAt: {type: string, format: date-time}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        summary: {type: object, description: 'Existing AnalyticsSummary with recomputed rates and percentiles'}
        delivery: {type: object, description: 'Existing AnalyticsDeliverySummary'}
        trend: {type: array, items: {type: object}}
        projects: {type: array, items: {type: object}, description: 'Project ID, name, businessDomainId and AnalyticsProjectUsage'}
        businessDomains: {type: array, items: {type: object}, description: 'ID, name, active, projectCount, runs, success, failed, tokens, costUsd, costKnown, uniqueIssues and delivered'}
    Project:
      type: object
      required: [id, name]
      properties:
        businessDomainId:
          type: string
          readOnly: true
          description: Current main business domain. Use the dedicated assignment endpoint to change it.
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        workflowId:
          type: string
        defaultRepositoryId:
          type: string
        ownerId:
          type: integer
          format: int64
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        clarification:
          $ref: "#/components/schemas/ClarificationPolicy"
        tapdWorkspaceId:
          type: string
        tapdIterationId:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ProjectMember:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum: [maintainer, member, viewer]
    User:
      type: object
      required: [id, loginName]
      properties:
        id: {type: integer, format: int64}
        staffId: {type: integer}
        loginName: {type: string}
        chineseName: {type: string}
        deptId: {type: integer}
        deptName: {type: string}
        avatarUrl: {type: string}
        taihuPatConfigured: {type: boolean, readOnly: true}
        gitTokenConfigured: {type: boolean, readOnly: true}
        codeBuddyApiKeyConfigured: {type: boolean, readOnly: true}
        codexApiKeyConfigured: {type: boolean, readOnly: true}
        codexBaseUrl: {type: string}
        claudeCodeApiKeyConfigured: {type: boolean, readOnly: true}
        claudeCodeBaseUrl: {type: string}
        codeBuddyInternetEnvironment: {type: string}
    ClarificationPolicy:
      type: object
      properties:
        enabled:
          type: boolean
        skillId:
          type: string
        threshold:
          type: integer
          minimum: 0
          maximum: 100
        dimensions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              question:
                type: string
              weight:
                type: integer
              minLength:
                type: integer
    RepositoryInput:
      type: object
      required: [projectId]
      anyOf:
        - required: [repoUrl]
        - required: [url]
        - required: [webUrl]

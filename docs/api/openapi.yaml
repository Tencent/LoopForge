      summary: Re-sync one TAPD-sourced issue from TAPD
      description: Pulls the linked TAPD story/bug again and refreshes the local issue content (title/description/status/priority). Local assignee, clarification state and repository bindings are preserved. Only issues with source=tapd are accepted.
      responses:
        "200":
          $ref: "#/components/responses/Issue"

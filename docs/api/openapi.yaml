  /api/issues:
    get:
      tags: [Issues]
      operationId: listIssues
      parameters:
        - name: projectId
          in: query
          required: false
          schema: {type: string}
          description: When set, only issues belonging to this project are returned.
        - name: status
          in: query
          required: false
          schema: {type: string}
          description: Filter by issue status. Comma-separated values are OR-matched.
        - name: source
          in: query
          required: false
          schema: {type: string}
          description: Filter by source (local, gongfeng, tapd). Comma-separated values are OR-matched.
        - name: q
          in: query
          required: false
          schema: {type: string}
          description: Case-insensitive match against title, id, number, or external id.
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200}
          description: When omitted, the response is Issue[]. When set, the response is a page object and limit is capped at 200.
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: Issue list, or a page when limit is set
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Issue"
                  - $ref: "#/components/schemas/IssueListPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Issues]
      operationId: createIssue
      requestBody:
        $ref: "#/components/requestBodies/Issue"
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Issues]
      operationId: upsertIssue
      requestBody:
        $ref: "#/components/requestBodies/Issue"
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/issues/import-tapd:
    post:
      tags: [Issues]
      operationId: importTAPDIssue
      summary: Import one TAPD story, bug or task from a pasted link
      description: Scores the imported title and description against the project's clarification policy. Below-threshold requirements are marked needs_user and cannot be dispatched until they pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, url]
              properties:
                projectId: {type: string}
                url: {type: string, description: TAPD story/bug/task detail URL or shared title and link; multiple different work items are rejected}
                baseBranch: {type: string, description: Existing work branch to continue directly for a single repository; empty creates a new work branch from its configured main branch; omitted preserves the selection when reimporting with the same repositories}
                repositoryBranches:
                  type: object
                  additionalProperties: {type: string}
                  description: Existing work branches keyed by bound repository ID; overrides baseBranch. Empty or unlisted branches create new work branches from each repository's configured main branch. Omitted preserves selections for retained repositories on reimport; an empty object clears all selections.
                workflowId: {type: string, description: SOP to bind on import; omitted uses the project default requirement workflow}
                repositoryId: {type: string, description: Primary repository; at least one of repositoryId or repositoryIds is required}
                repositoryIds:
                  type: array
                  items: {type: string}
                  description: Repositories to bind; import is rejected if none are selected
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/issues/{issueId}/resync-tapd:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: resyncTAPDIssue
      summary: Re-sync one TAPD-sourced issue from TAPD
      description: Pulls the linked TAPD story/bug/task again and refreshes the local issue content (title/description/status/priority). Local assignee, clarification state, base branch and repository bindings are preserved. Only issues with source=tapd are accepted.
      responses:
        "200":
          $ref: "#/components/responses/Issue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/issues/{issueId}:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    get:
      tags: [Issues]
      operationId: getIssue
      responses:
        "200":
          description: Issue and comments
          content:
            application/json:
              schema:
                type: object
                required: [issue, comments]
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/IssueComment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Issues]
      operationId: deleteIssue
      summary: Delete a local requirement
      description: Deletes the issue, clarification, comments and failed/cancelled tasks, runs, logs, artifacts, previews and execution environments. Successful or active executions prevent deletion. The external tracker record is retained and sync may import the issue again.
      responses:
        "204":
          description: Local issue deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Issue has successful execution history or is clarifying or executing a SOP
  /api/issues/{issueId}/comments:
    parameters:
      - $ref: "#/components/parameters/IssueId"
    post:
      tags: [Issues]
      operationId: createIssueComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueComment"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/issues/{issueId}/runs:

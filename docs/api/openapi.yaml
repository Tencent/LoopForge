openapi: 3.1.0
info:
  title: AgentFlow Platform REST API
  version: 1.0.0
  description: |
    Public control-plane API exposed by AgentFlow Studio. Signed login cookies and
    user-owned Bearer tokens authenticate Studio, REST API, and MCP access. Legacy
    deployment-level Basic authentication remains available. Worker signals,
    OTLP ingestion, run leases, and sandbox-reclamation endpoints are intentionally
    excluded because they are internal implementation contracts.
servers:
  - url: /
security:
  - bearerAuth: []
  - cookieAuth: []
  - basicAuth: []
tags:
  - name: System
  - name: Assistant
  - name: Projects
  - name: BusinessDomains
  - name: Repositories
  - name: Issues
  - name: Tasks
  - name: Assets
  - name: Workflows
  - name: Runs
  - name: Sync
  - name: Scheduling
  - name: Analytics
paths:
  /api/task-groups:
    post:
      tags: [Runs]
      operationId: startTaskGroup
      summary: startTaskGroup
      description: Requires project membership. Creates durable independent Agent tasks in a shared workspace; existing changes are not rolled back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowId, projectId, input]
              properties:
                workflowId: {type: string}
                projectId: {type: string}
                input: {type: string}
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Task unavailable or conflicting requestId
  /api/runs/{id}/group/tasks:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Runs]
      operationId: dispatchGroupTask
      summary: dispatchGroupTask
      description: Requires project membership. Creates durable independent Agent tasks in a shared workspace; existing changes are not rolled back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, prompt, requestId]
              properties:
                agentId: {type: string}
                prompt: {type: string}
                requestId: {type: string}
                files:
                  type: array
                  items: {type: string}
                  maxItems: 20
      responses:
        "201":
          description: Created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Task unavailable or conflicting requestId
  /api/runs/{id}/group/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Runs]
      operationId: inviteGroupMember
      summary: inviteGroupMember
      description: Requires project membership. Invites an available project role to the group without starting execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: {type: string}
      responses:
        "200":
          description: Joined
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Task unavailable or conflicting requestId
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Check service health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/assistant/chat:
    post:
      tags: [Assistant]
      operationId: chatAssistant
      summary: Ask the Studio AI assistant or generate platform resource drafts
      description: |
        Uses the signed-in user's personal CodeBuddy API key. The model can
        request bounded source lookups and project HTTP MCP calls (`mcpCalls`).
        The CLI itself cannot call MCP, modify the source snapshot, push, or
        deploy. The server invokes TAPD/Gongfeng-style HTTP MCP that the user
        can already see in the current project, using the user's credentials,
        and redacts secrets from results. Drafts may use any public MCP write
        tool (agents, workflows including script nodes, sandboxes, Dockerfiles,
        schedule jobs, publish, start run, and so on) plus assistant_tasks_save.
        The browser applies those drafts with a separate MCP tools/call after
        the user confirms. Assistant scheduled prompts are saved with
        PUT /api/assistant/tasks and are isolated per project. Send
        `Accept: text/event-stream` to receive thought events and a final
        result event; otherwise the response is a single JSON object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                projectId: {type: string}
                sessionId: {type: string}
                model: {type: string}
                updatedAt: {type: string, format: date-time}
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: {type: string, enum: [user, assistant]}
                      content: {type: string}
                      authorId: {type: integer}
                      authorName: {type: string}
                      speakerAgentId: {type: string}
                      speakerName: {type: string}
      responses:
        "200":
          description: Assistant reply, optional source citations, and unsaved drafts
          content:
            application/json:
              schema:
                type: object
                required: [message, drafts]
                properties:
                  message: {type: string}
                  sessionId: {type: string}
                  drafts:
                    type: array
                    maxItems: 12
                    items:
                      type: object
                      required: [tool]
                      properties:
                        tool: {type: string, description: Public MCP write tool or assistant_tasks_save}
                        path:
                          type: object
                          additionalProperties: true
                        query:
                          type: object
                          additionalProperties: true
                        body: {type: object}
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        path: {type: string}
                        line: {type: integer}
                        text: {type: string}
                  mcpCalls:
                    type: array
                    maxItems: 3
                    description: Internal follow-up requests; the HTTP response is the final answer after the server executes them.
                    items:
                      type: object
                      required: [server]
                      properties:
                        server: {type: string}
                        tool: {type: string}
                        arguments:
                          type: object
                          additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: The user already has a generation in progress
        "502":
          description: The model failed or returned an invalid draft
        "504":
          description: Generation cancelled or timed out
  /api/assistant/models:
    get:
      tags: [Assistant]
      operationId: listAssistantModels
      summary: List CodeBuddy models available to the Studio assistant
      description: |
        Hardcoded iOA assistant catalog with display names and credit
        multipliers. Defaults to default.
      responses:
        "200":
          description: Model catalog
          content:
            application/json:
              schema:
                type: object
                required: [default, models]
                properties:
                  default: {type: string}
                  models:
                    type: array
                    items:
                      type: object
                      required: [id, name, family, credits]
                      properties:
                        id: {type: string}
                        name: {type: string}
                        family: {type: string}
                        credits: {type: string, example: x0.79}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/assistant/sessions:
    get:
      tags: [Assistant]
      operationId: listAssistantSessions
      summary: List personal conversations and authorized shared SOP discussions
      description: Conversations persist in MySQL `assistant_sessions`. Personal conversations belong to the caller; shared SOP conversations belong to a run and require project access.
      responses:
        "200":
          description: Recent conversations without message bodies
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    title: {type: string}
                    projectId: {type: string}
                    model: {type: string}
                    shared: {type: boolean}
                    runId: {type: string}
                    generationStatus: {type: string}
                    updatedAt: {type: string, format: date-time}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/runs/{id}/conversation:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Assistant]
      operationId: getRunConversation
      summary: Open the shared conversation for one SOP run
      description: Requires project access. Every authorized member receives the same session, including user authorId/authorName and role speakerAgentId/speakerName. First open preserves existing run discussions. Model/tool calls use the caller's own credentials.
      responses:
        "200":
          description: Shared conversation with messages and updatedAt
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/assistant/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Assistant]
      operationId: getAssistantSession
      summary: Load one assistant conversation
      responses:
        "200":
          description: Conversation including messages
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Assistant]
      operationId: putAssistantSession
      summary: Update one assistant conversation
      description: Persists draft execution receipts. Shared sessions require the last updatedAt, preserve existing message bodies and attribution, and reject edits during generation. Stored in MySQL `assistant_sessions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string}
                title: {type: string}
                projectId: {type: string}
                model: {type: string}
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: {type: string}
                      content: {type: string}
      responses:
        "200":
          description: Conversation saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Assistant]
      operationId: deleteAssistantSession
      summary: Delete one assistant conversation
      description: Also removes the matching CodeBuddy CLI transcript under the user's private HOME.
      responses:
        "200":
          description: Conversation and CLI transcript deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/assistant/sessions/{id}/fork:
    post:
      tags: [Assistant]
      operationId: forkAssistantSession
      summary: Edit a user message and create a conversation branch
      description: Preserves the original conversation and all previously executed changes. Shared SOP branches remain visible to project members. Inherited drafts are read-only history. Stop an active generation before branching.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageIndex, content, updatedAt]
              properties:
                messageIndex:
                  type: integer
                  minimum: 0
                content:
                  type: string
                updatedAt:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Created branch with parentSessionId, rootSessionId and forkMessageIndex
        "400":
          description: Invalid message or attachment
        "403":
          description: Conversation or project access denied
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Source conversation changed or generation still active
  /api/assistant/tasks:
    get:
      tags: [Assistant]
      operationId: listAssistantTasks
      summary: List the current user's assistant scheduled prompts
      description: |
        These tasks make the Studio assistant run a user-written prompt on an
        interval, scoped to one Studio project. They persist in MySQL
        `assistant_tasks` and are not TAPD/Gongfeng SOP schedule jobs. Each run
        starts a fresh CodeBuddy session and does not resume the previous run.
        During execution the server may invoke that project's HTTP MCP servers
        (for example TAPD) on the model's `mcpCalls`.
      parameters:
        - name: projectId
          in: query
          required: false
          schema: {type: string}
          description: When set, only tasks belonging to this project are returned.
      responses:
        "200":
          description: Assistant-owned scheduled prompts
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Assistant]
      operationId: saveAssistantTask
      summary: Create or update an assistant scheduled prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, prompt, projectId]
              properties:
                id: {type: string}
                name: {type: string}
                prompt: {type: string}
                notifications: {type: array, maxItems: 3, items: {$ref: "#/components/schemas/NotificationBinding"}}
                intervalSec: {type: integer, minimum: 60, description: Used when cron is empty. Minimum 60 seconds.}
                cron: {type: string, description: Optional 5-field cron (minute hour day month weekday) in Asia/Shanghai. When set, intervalSec is ignored.}
                enabled: {type: boolean}
                model: {type: string, description: CodeBuddy model id used when the task runs}
                projectId: {type: string, description: Studio project that owns this assistant task}
      responses:
        "200":
          description: Saved task
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/assistant/tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    delete:
      tags: [Assistant]
      operationId: deleteAssistantTask
      summary: Delete an assistant scheduled prompt
      responses:
        "200":
          description: Task deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/assistant/tasks/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    post:
      tags: [Assistant]
      operationId: runAssistantTask
      summary: Run an assistant scheduled prompt immediately
      responses:
        "202":
          description: Execution started
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: The user already has a generation in progress
  /api/capabilities:
    get:
      tags: [System]
      operationId: getCapabilities
      summary: List public REST and MCP operations
      responses:
        "200":
          description: Public operation manifest and MCP transports
          content:
            application/json:
              schema:
                type: object
                required: [operations, mcp]
                properties:
                  operations:
                    type: array
                    items:
                      type: object
                      required: [name, description, method, path, readOnly]
                      properties:
                        name: {type: string}
                        description: {type: string}
                        method: {type: string}
                        path: {type: string}
                        readOnly: {type: boolean}
                  mcp:
                    type: object
                    properties:
                      streamableHttp: {type: string}
                      stdioCommand: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenAPI
      summary: Read this OpenAPI 3.1 contract
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/photo/{spec}/{username}:
    get:
      tags: [System]
      operationId: getEmployeePhoto
      summary: Fetch employee avatar photo from TOF authentication service
      parameters:
        - name: spec
          in: path
          required: true
          description: Photo dimension (48, 100, 150, 500)
          schema: {type: integer, enum: [48, 100, 150, 500]}
        - name: username
          in: path
          required: true
          description: Employee English login name (with or without .png)
          schema: {type: string}
      responses:
        "200":
          description: Avatar image binary
          headers:
            Cache-Control:
              schema: {type: string, example: "public, max-age=86400"}
          content:
            image/png:
              schema: {type: string, format: binary}
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: TOF photo gateway error
  /api/auth/tokens:
    get:
      tags: [System]
      operationId: listPersonalTokens
      summary: List tokens owned by the logged-in user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Token metadata; plaintext and hashes are never returned
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/APIToken"}
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [System]
      operationId: createPersonalToken
      summary: Create a personal REST API and MCP token
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 128}
                expiresInDays: {type: integer, minimum: 1, maximum: 365, default: 90}
      responses:
        "201":
          description: Plaintext token is returned once in this response
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  metadata: {$ref: "#/components/schemas/APIToken"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/tokens/{tokenId}:
    delete:
      tags: [System]
      operationId: revokePersonalToken
      summary: Revoke one token owned by the logged-in user
      security:
        - cookieAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bootstrap:
    get:
      tags: [System]
      operationId: getBootstrap
      summary: Load the complete Studio bootstrap catalog
      responses:
        "200":
          description: Bootstrap state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users with credential values redacted
      responses:
        "200":
          description: User directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /api/users/{id}/credentials:
    put:
      tags: [Users]
      operationId: updateOwnCredentials
      summary: Update credentials for the current authenticated user
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                taihuPat: {type: string, writeOnly: true, description: "Taihu personal access token. Blank preserves the stored token."}
                taihuPatClear: {type: boolean}
                gitToken: {type: string, writeOnly: true}
                gitTokenClear: {type: boolean}
                codeBuddyApiKey: {type: string, writeOnly: true}
                codeBuddyApiKeyClear: {type: boolean}
                codeBuddyInternetEnvironment: {type: string}
                codexApiKey: {type: string, writeOnly: true, description: "Blank preserves the stored key."}
                codexApiKeyClear: {type: boolean}
                codexBaseUrl: {type: string, description: "HTTP(S) Responses API base URL. Omitted preserves the value; empty uses the official endpoint."}
                claudeCodeApiKey: {type: string, writeOnly: true, description: "Blank preserves the stored key."}
                claudeCodeApiKeyClear: {type: boolean}
                claudeCodeBaseUrl: {type: string, description: "HTTP(S) Anthropic-compatible service URL. Omitted preserves the value; empty uses the official endpoint."}
      responses:
        "200":
          description: Redacted saved user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Unauthorized"
  /api/business-domains:
    get:
      tags: [BusinessDomains]
      operationId: listBusinessDomains
      responses:
        "200":
          description: Domain catalog, per-domain canManage/canView, canAdmin and userId
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        domain: {$ref: "#/components/schemas/BusinessDomain"}
                        canManage: {type: boolean}
                        canView: {type: boolean}
                  canAdmin: {type: boolean}
                  userId: {type: integer, format: int64}
        "401": {$ref: "#/components/responses/Unauthorized"}
    put:
      tags: [BusinessDomains]
      operationId: saveBusinessDomain
      parameters:
        - name: createOnly
          in: query
          description: Reject an existing ID with 409 instead of updating it.
          schema: {type: boolean, default: false}
      description: Platform admins create and enable/disable domains and assign managers. Domain managers may edit names, descriptions and viewers. Duplicate names or concurrent updates return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BusinessDomain"}
      responses:
        "200":
          description: Saved domain
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BusinessDomain"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Caller cannot manage this domain or change protected grants}
        "409": {description: Duplicate name or concurrent update}
  /api/business-domain-report:
    get:
      tags: [BusinessDomains]
      operationId: getBusinessDomainReport
      description: Aggregate only. Queries always resolve current project attribution; historical runs follow the current domain. All means the caller's authorized reporting scope. Unclassified projects are visible to their owners and platform admins.
      parameters:
        - name: businessDomainId
          in: query
          schema: {type: string, default: all}
          description: Domain ID, all, or unclassified
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: grain
          in: query
          schema: {type: string, enum: [day, week, month], default: day}
      responses:
        "200":
          description: Current-attribution summary, delivery summary, trend, project contributions and business-domain distribution; excludes run, user and log details
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BusinessDomainReport"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Domain aggregate access not granted}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/projects/{projectId}/business-domain:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    put:
      tags: [BusinessDomains]
      operationId: assignProjectBusinessDomain
      description: Owners can assign an unclassified project. Platform admins can transfer or clear an assignment. Target must be active. Compare-and-swap protects against concurrent reassignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [businessDomainId, expectedDomainId]
              properties:
                businessDomainId: {type: string, description: 'Empty string clears the assignment'}
                expectedDomainId: {type: string, description: 'Previously observed assignment; empty for unclassified'}
                reason: {type: string, maxLength: 500}
      responses:
        "200": {$ref: "#/components/responses/Project"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Owner or platform admin access required}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {description: Project assignment changed; refresh before retrying}
  /api/projects/{projectId}/business-domain/history:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [BusinessDomains]
      operationId: getProjectBusinessDomainHistory
      responses:
        "200":
          description: Last 100 assignment changes, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/BusinessDomainAssignment"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {description: Project owner or platform admin access required}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      responses:
        "200":
          $ref: "#/components/responses/ProjectList"
        "401":

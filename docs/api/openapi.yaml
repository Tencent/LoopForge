  /api/deployment-metrics:
    get:
      tags: [Analytics]
      operationId: getDeploymentMetrics
      summary: Query SkillHub test-environment deployment duration
      description: Uses Zhiyan project 20732, pipeline 11867454, and the signed-in user's Taihu credential. Loads all branches by default; branch is an optional filter. Other repositories are rejected.
      parameters:
        - {name: projectId, in: query, required: true, schema: {type: string}}
        - {name: repositoryId, in: query, required: true, schema: {type: string}}
        - {name: branch, in: query, required: false, description: Optional branch filter; omit to load all branches, schema: {type: string}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200":
          description: Normalized deployment metrics and build records
          content:
            application/json:
              schema:
                type: object
                required: [projectId, repositoryId, branch, pipelineProjectId, pipelineId, queriedAt, summary, records]
                properties:
                  projectId: {type: string}
                  repositoryId: {type: string}
                  repositoryName: {type: string}
                  branch: {type: string}
                  pipelineProjectId: {type: integer}
                  pipelineId: {type: integer}
                  pipelineUrl: {type: string, format: uri}
                  queriedAt: {type: string, format: date-time}
                  summary:
                    type: object
                    properties:
                      total: {type: integer}
                      succeeded: {type: integer}
                      failed: {type: integer}
                      running: {type: integer}
                      successRate: {type: number}
                      deployments7d: {type: integer}
                      average7dDurationMs: {type: integer, format: int64}
                      averageDurationMs: {type: integer, format: int64}
                      p50DurationMs: {type: integer, format: int64}
                      p90DurationMs: {type: integer, format: int64}
                      latestDurationMs: {type: integer, format: int64}
                  records:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        runNumber: {type: integer, format: int64}
                        status: {type: integer}
                        statusLabel: {type: string}
                        branch: {type: string}
                        revision: {type: string}
                        starter: {type: string}
                        triggerType: {type: string}
                        comment: {type: string}
                        startedAt: {type: string, format: date-time}
                        finishedAt: {type: string, format: date-time}
                        durationMs: {type: integer, format: int64}
                        url: {type: string, format: uri}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          description: QCI MCP or personal credential is not configured
        "422":
          description: The selected repository is not the SkillHub repository
        "502":
          description: CodingCI query failed or returned an unsupported payload

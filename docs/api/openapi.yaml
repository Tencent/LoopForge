      operationId: listSkillhubSkills
      summary: Search public SkillHub skills through the platform proxy
      description: Only whitelisted query parameters are forwarded. SkillHub failures map to 429 (rate limited), 502 (unavailable) or 504 (timeout).
      parameters:
        - {name: keyword, in: query, schema: {type: string, maxLength: 100}}
        - {name: category, in: query, schema: {type: string}}
        - {name: sortBy, in: query, schema: {type: string, enum: [downloads, score, updated_at], default: downloads}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 24}}
      responses:
        "200":
          description: "{total, page, pageSize, items:[{slug, namespace, name, description, iconUrl, category, version, ownerName, homepage, downloads, stars, labels, verified, updatedAt}]}"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/SkillhubUnavailable"
        "502":
          $ref: "#/components/responses/SkillhubUnavailable"
        "504":
          $ref: "#/components/responses/SkillhubUnavailable"

  /api/runs/{runId}/workspace/terminal:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      tags: [Runs]
      operationId: controlRunWorkspaceTerminal
      summary: Open, poll, type into, resize or close a workspace PTY
      description: Requires project write membership and an active human editor lease. Shells run on the workspace owner with a sanitized environment; a disconnected client is reclaimed after 15 seconds. Terminal data is transient and output is base64 encoded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation: {type: string, enum: [open, read, input, resize, close]}
                id: {type: string}
                data: {type: string, maxLength: 32768}
                cols: {type: integer}
                rows: {type: integer}
      responses:
        "200":
          description: Terminal identifier and new output
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  data: {type: string, format: byte}
                  exited: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {description: Execution not stopped, editor lease expired, foreign terminal, or workspace unavailable}
  /api/runs/{runId}/workspace:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:

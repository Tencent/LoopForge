                cols: {type: integer}
                rows: {type: integer}
      responses:
        "200":
          description: Terminal identifier and new output
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  data: {type: string, format: byte}
                  exited: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}

    parameters:
      - $ref: "#/components/parameters/JobId"
    delete:
      tags: [Scheduling]
      operationId: deleteScheduleJob
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/schedule-jobs/{jobId}/run:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [Scheduling]
      operationId: runScheduleJob
      description: |
        Starts the job on the server and returns 202 with lastStatus=running.
        Closing the client does not cancel the run. Poll GET /api/schedule-jobs
        until lastStatus is success, failed, or waiting.
      responses:
        "202":
          $ref: "#/components/responses/ScheduleJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/page-feedback:
    post:
      tags: [Feedback]
      operationId: submitPageFeedback
      description: |
        Submits a report from the floating page feedback widget. The report is
        stored in its own table and is not linked to any project or issue.
        Only a signed-in, non-guest browser session may submit: guests, expired
        sessions and anonymous callers get 401 {"error":"请先登录"}; requests
        carrying an Authorization Bearer header (personal API token) are
        refused with 401 as well. The submitter (userId, loginName = RTX, chineseName snapshot falling back to
        loginName) is always taken from the session; submitter fields in the
        payload are ignored. Images are sniffed by content and must be PNG,
        JPEG, GIF or WebP; at most 5 images of 5MB each, 27MB request body.
        Sensitive query parameters (token, code, ticket, session, key, secret,
        password…) are removed from url and frameUrl before storage.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: JSON-encoded PageFeedbackPayload
                images:
                  type: array
                  maxItems: 5
                  items: {type: string, format: binary}
            encoding:
              payload:
                contentType: application/json
      responses:
        "201":
          description: Stored feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageFeedback"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Request body exceeds 27MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Feedback]
      operationId: listPageFeedback
      description: |
        Lists every report newest first. Any signed-in employee may read all
        reports, using the browser session or a personal API token (Bearer).
        Guests get 401. Images carry metadata and a download url only.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Page of feedback
          content:
            application/json:
              schema:
                type: object
                required: [items, total, offset, limit, hasMore]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PageFeedback"
                  total: {type: integer, format: int64}
                  offset: {type: integer}
                  limit: {type: integer}
                  hasMore: {type: boolean}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/page-feedback/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Feedback]
      operationId: getPageFeedback
      description: One report with its submitter. Session cookie or personal API token; guests get 401.
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageFeedback"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/page-feedback/{id}/images/{imageId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: imageId
        in: path
        required: true
        schema: {type: string}
    get:
      tags: [Feedback]
      operationId: getPageFeedbackImage
      description: |
        Image bytes served inline with the stored content type,
        X-Content-Type-Options nosniff and Content-Security-Policy
        default-src 'none'. 404 when the image does not belong to the report.
        Session cookie or personal API token; guests get 401.
      responses:
        "200":
          description: Image
          content:
            image/png: {}
            image/jpeg: {}
            image/gif: {}
            image/webp: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/shared-schedule-tasks:
    get:
      tags: [Scheduling]
      operationId: listSharedScheduleTasks
      summary: List latest published shared AI task versions
      responses:
        "200":
          description: Latest immutable definition for each shared task, without credentials or project notifications
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SharedScheduleVersion"}}
  /api/shared-schedule-tasks/{id}/versions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Scheduling]
      operationId: listSharedScheduleVersions
      summary: List immutable versions in descending order
      responses:
        "200":
          description: Published versions, retained while subscriptions can reference them
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SharedScheduleVersion"}}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/schedule-jobs/{id}/publish:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Scheduling]
      operationId: publishSharedScheduleVersion
      summary: Publish a credential-free version from an independent AI task
      description: Requires source project write access. Trigger configs and subscriptions cannot be republished. Publishing never changes existing subscriptions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion]
              properties:
                name: {type: string, maxLength: 255}
                description: {type: string, maxLength: 2000}
                prompt: {type: string, description: 'Template with {{params.name}} placeholders; defaults to source task prompt'}
                parameters: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/ScheduleParameter"}}
                changeNote: {type: string, maxLength: 1000}
                baseVersion: {type: integer, minimum: 0, description: '0 for first publication, otherwise the latest published version'}
      responses:
        "201":
          description: Newly published immutable version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SharedScheduleVersion"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: agentflow_user
    basicAuth:
      type: http
      scheme: basic
  parameters:
    SkillhubSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"
    SkillhubNamespace:
      name: namespace
      in: query
      description: SkillHub publisher handle; slugs are only unique within a namespace
      schema:
        type: string
    SkillhubVersion:
      name: version
      in: query
      description: Defaults to the latest version
      schema:
        type: string
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
    AssetIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    RepositoryIdQuery:
      name: id
      in: query
      required: true
      schema:
        type: string
    NodeIdQuery:
      name: nodeId
      in: query
      schema:
        type: string
    After:
      name: after
      in: query
      schema:
        type: integer
        format: int64
    Before:
      name: before
      in: query
      schema:
        type: integer
        format: int64
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
  requestBodies:
    Project:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Project"
              - type: object
                properties:
                  tapdClear:
                    type: boolean
    Repository:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepositoryInput"
    Issue:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Issue"
              - type: object
                properties:
                  syncTarget:
                    type: string
                    enum: [gongfeng, tapd]
    ChatClarify:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChatClarifyRequest"
    Agent:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentDefinition"
    Asset:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenObject"
    Workflow:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowDefinition"
    NodeAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [nodeId]
            properties:
              nodeId:
                type: string
    SyncConfig:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncConfig"
    ScheduleJob:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScheduleJob"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Basic authentication required
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Operation is disabled or forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SkillhubUnavailable:
      description: SkillHub rejected the package (422), rate limited (429), is unavailable (502) or timed out (504)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: Upstream analysis timed out
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Ok:
      description: Operation succeeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Ok"
    Status:
      description: Status result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Status"
    Project:
      description: Project
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Project"
    ProjectList:
      description: Project list
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Project"
    Repository:
      description: Repository
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Repository"
    Issue:
      description: Issue
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Issue"
    Workflow:
      description: Workflow definition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkflowDefinition"
    WorkflowList:
      description: Workflow definitions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/WorkflowDefinition"
    Run:
      description: Run
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Run"
    RunList:
      description: Run summaries
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Run"
    RevisionList:
      description: Definition revisions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DefinitionRevision"
    AssetList:
      description: Asset definitions
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OpenObject"
    ClarifyResult:
      description: JSON clarification result or SSE event stream
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClarifyResult"
        text/event-stream:
          schema:
            type: string
    SyncConfig:
      description: Sync configuration
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SyncConfig"
    ScheduleJob:
      description: Schedule job
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScheduleJob"
    ScheduleJobList:
      description: Schedule jobs
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ScheduleJob"
  schemas:
    OpenObject:
      type: object
      additionalProperties: true
    APIToken:
      type: object
      required: [id, userId, name, prefix, createdAt]
      properties:
        id: {type: string}
        userId: {type: integer, format: int64}
        name: {type: string}
        prefix: {type: string, description: Non-secret display prefix}
        lastUsedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    PageFeedbackPayload:
      type: object
      description: Unknown fields, including any submitter fields, are ignored.
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 120, description: First line of the user's text}
        description: {type: string, maxLength: 5000, description: Full text}
        url: {type: string, maxLength: 2048}
        route: {type: string, description: Hash route}
        view: {type: string}
        frameUrl: {type: string, maxLength: 2048, description: Workbench iframe location}
        context:
          $ref: "#/components/schemas/PageFeedbackContext"
        element:
          $ref: "#/components/schemas/PageFeedbackElement"
    PageFeedbackContext:
      type: object
      properties:
        scroll: {$ref: "#/components/schemas/PageFeedbackPoint"}
        viewport:
          type: object
          properties:
            width: {type: number}
            height: {type: number}
        dpr: {type: number}
        userAgent: {type: string}
        language: {type: string}
        theme: {type: string}
        capturedAt: {type: string}
    PageFeedbackPoint:
      type: object
      properties:
        x: {type: number}
        y: {type: number}
    PageFeedbackRect:
      type: object
      properties:
        x: {type: number}
        y: {type: number}
        width: {type: number}
        height: {type: number}
    PageFeedbackElement:
      type: object
      properties:
        selector: {type: string}
        tag: {type: string}
        text: {type: string, maxLength: 200}
        rect: {$ref: "#/components/schemas/PageFeedbackRect"}
        pageRect: {$ref: "#/components/schemas/PageFeedbackRect"}
        point: {$ref: "#/components/schemas/PageFeedbackPoint"}
        inFrame: {type: boolean}
    PageFeedback:
      type: object
      required: [id, title, url, route, context, submitter, images, createdAt]
      properties:
        id: {type: string}
        title: {type: string}
        description: {type: string}
        url: {type: string}
        route: {type: string}
        view: {type: string}
        frameUrl: {type: string}
        context: {$ref: "#/components/schemas/PageFeedbackContext"}
        element: {$ref: "#/components/schemas/PageFeedbackElement"}
        submitter:
          type: object
          required: [userId, loginName, chineseName]
          properties:
            userId: {type: integer, format: int64}
            loginName: {type: string, description: Employee RTX}
            chineseName: {type: string, description: Snapshot at submit time; RTX when empty}
        images:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              position: {type: integer}
              fileName: {type: string}
              mimeType: {type: string}
              size: {type: integer, format: int64}
              sha256: {type: string}
              url: {type: string}
              createdAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    BusinessDomain:
      type: object
      required: [id, name, active, managerIds, viewerIds]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$', description: 'Stable ID; all and unclassified are reserved'}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 2000}
        active: {type: boolean}
        managerIds: {type: array, uniqueItems: true, items: {type: integer, format: int64}}
        viewerIds: {type: array, uniqueItems: true, items: {type: integer, format: int64}}
        createdAt: {type: string, format: date-time, readOnly: true}
        updatedAt: {type: string, format: date-time, readOnly: true}
    BusinessDomainAssignment:
      type: object
      properties:
        id: {type: integer, format: int64}
        projectId: {type: string}
        fromDomainId: {type: string}
        toDomainId: {type: string}
        actorId: {type: integer, format: int64}
        reason: {type: string}
        createdAt: {type: string, format: date-time}
    BusinessDomainReport:
      type: object
      properties:
        attribution: {type: string, const: current}
        generatedAt: {type: string, format: date-time}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        summary: {$ref: "#/components/schemas/AnalyticsCostSummary"}
        delivery: {type: object, description: 'Existing AnalyticsDeliverySummary'}
        trend: {type: array, items: {type: object}}
        projects: {type: array, items: {type: object}, description: 'Project ID, name, businessDomainId and AnalyticsProjectUsage'}
        businessDomains: {type: array, items: {type: object}, description: 'ID, name, active, projectCount, runs, success, failed, tokens, costCny, legacy USD equivalent costUsd, costKnown, uniqueIssues and delivered'}
        deliveryMetrics: {$ref: "#/components/schemas/BusinessDeliveryMetrics"}
        deliveryTrend:
          type: array
          items:
            type: object
            properties:
              date: {type: string, description: 'Day, ISO week or month in the reporting timezone'}
              completedIssues: {type: integer}
              mergedMrs: {type: integer}
              cycleSamples: {type: integer}
              averageCycleDurationMs: {type: integer, format: int64}
              executionSamples: {type: integer}
              averageExecutionDurationMs: {type: integer, format: int64, description: Average completion duration excluding waits; requires executionSamples greater than zero}
        timeZone: {type: string}
        grain: {type: string, enum: [day, week, month]}
    BusinessDeliveryMetrics:
      type: object
      description: 'Also included as deliveryMetrics on each project and business domain. Completion, merge and Run creation windows are independent. No individual issue or Run details are returned.'
      properties:
        completionToMergeSamples: {type: integer, description: 'One sample per unique repository and MR IID, filtered by its own merge time'}
        averageCompletionToMergeMs: {type: integer, format: int64, description: 'Mean of the latest matched successful completion to each individual MR actual merge; multiple MRs for one issue are separate samples'}
        completionToMergeMissingIssues: {type: integer, description: 'Merged items without matched completion events or complete delivery MR evidence'}
        completionToMergeMissingMrs: {type: integer, description: 'Merged MRs missing completion events or matching delivery evidence'}
        mergedBeforeCompletionMrs: {type: integer, description: 'MRs merged before matching flow completion, excluded from latency averages'}
        mergedBeforeCompletionIssues: {type: integer, description: 'Items merged before their flow finished; excluded from the latency average'}
        completedIssues: {type: integer, description: 'Current done/closed/completed work items whose completion time falls in the requested window; includes Issues'}
        mergedMrs: {type: integer, description: 'Unique work MRs by actual merged_at, including integration branches, excluding baseline promotion MRs'}
        mergedMrsMissingTime: {type: integer, description: 'Merged MRs in scope with no merge timestamp, excluded from dated counts'}
        completionTimeMissingIssues: {type: integer, description: 'Currently completed historical items with no usable time, excluded from dated completion counts'}
        estimatedCompletionIssues: {type: integer, description: 'Included historical items whose time is inferred from their latest successful top-level Run'}
        cycleSamples: {type: integer}
        averageCycleDurationMs: {type: integer, format: int64, description: Completion elapsed time including waits; averaged over cycleSamples}
        executionSamples: {type: integer, description: Completed items with node execution events for every related attempt and child SOP}
        averageExecutionDurationMs: {type: integer, format: int64, description: Union of actual node execution intervals per item; excludes waits and double counting of parallel or nested execution; averaged over executionSamples}
        p50CycleDurationMs: {type: integer, format: int64, deprecated: true}
        p95CycleDurationMs: {type: integer, format: int64, deprecated: true, description: 'Nearest-rank percentile over individual work items, never an average of project percentiles'}
        completedTokens: {type: integer, format: int64}
        averageTokensPerCompletedIssue: {type: integer, format: int64}
        latestCompletedAt: {type: string, format: date-time}
    Project:
      type: object
      required: [id, name]
      properties:
        businessDomainId:
          type: string
          readOnly: true
          description: Current main business domain. Use the dedicated assignment endpoint to change it.
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: string
        workflowId:
          type: string
        defaultRepositoryId:
          type: string
        ownerId:
          type: integer
          format: int64
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        clarification:
          $ref: "#/components/schemas/ClarificationPolicy"
        tapdWorkspaceId:
          type: string
        tapdIterationId:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    ProjectMember:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum: [maintainer, member, viewer]
    PlatformAccount:
      type: object
      properties:
        userId: {type: integer, format: int64}
        loginName: {type: string}
        chineseName: {type: string}
        admin: {type: boolean}
        password: {type: boolean, description: False for accounts that sign in through GitHub or a gateway}
        codeBuddyApiKeyConfigured: {type: boolean}
        createdAt: {type: string, format: date-time}
    PlatformCodeBuddyKey:
      type: object
      properties:
        configured: {type: boolean}
        internetEnvironment: {type: string}
        models: {type: array, items: {type: string}, description: Allowed models, the default first}
        updatedAt: {type: string, format: date-time}

      requestBody:
        $ref: "#/components/requestBodies/Project"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Projects]
      operationId: upsertProject
      requestBody:
        $ref: "#/components/requestBodies/Project"
      responses:
        "200":
          $ref: "#/components/responses/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path

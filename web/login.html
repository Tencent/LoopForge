<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LoopForge · 登录</title>
  <script src="/boot-theme.js?v=20261031boot1"></script>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app/sliding-tabs.css">
  <link rel="stylesheet" href="/preferences.css">
  <script src="/boot.js"></script>
  <script src="/i18n-en.js"></script>
  <script src="/i18n.js"></script>
  <script defer src="/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/images/loopforge-logo.png" alt="" width="56" height="56">
    <h1>LoopForge</h1>
    <p id="loginSubtitle">登录你的交付工作台</p>
    <p id="setupNotice" class="login-setup" hidden>这是首次启动。创建的第一个账号将成为平台管理员。</p>
    <form id="loginForm">
      <label>用户名<input name="login" autocomplete="username" required maxlength="64" autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="72"></label>
      <label id="confirmField" hidden>确认密码<input name="confirm" type="password" autocomplete="new-password" maxlength="72"></label>
      <p id="passwordRule" class="login-rule" hidden>密码至少 6 个字符</p>
      <p id="loginError" role="alert"></p>
      <button id="loginSubmit" class="button primary" type="submit">登录</button>
    </form>
    <div id="githubLogin" hidden>
      <p class="login-divider"><span>或</span></p>
      <a id="githubLoginButton" class="button login-github" href="/api/auth/github/login/start">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>使用 GitHub 登录</span>
      </a>
    </div>
    <p class="login-help" id="loginSwitch" hidden><span id="switchText">还没有账号？</span> <button type="button" id="switchMode" class="login-link">注册</button></p>
    <p class="login-help" id="loginContact" hidden>请联系部署管理员创建账号。</p>
    <div class="login-preferences">
      <div id="loginLang" class="lang-switch" role="radiogroup" aria-label="中文 / English" data-i18n-skip>
        <button type="button" role="radio" data-lang-value="zh" aria-checked="true">中</button>
        <button type="button" role="radio" data-lang-value="en" aria-checked="false">EN</button>
      </div>
      <button id="loginTheme" type="button">切换主题</button>
      <a href="https://github.com/Tencent/LoopForge">GitHub ↗</a>
    </div>
  </main>
  <script src="/app/sliding-tabs.js?v=20261121lang1"></script>
</body>
</html>
